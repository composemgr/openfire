name: openfire
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  server:
    image: nasqueron/openfire:latest
    container_name: openfire-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: openfire-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/config/openfire:/var/lib/openfire'
      - './volumes/data/log/openfire:/var/log/openfire'
      - './volumes/data/openfire/plugin-admin:/usr/share/openfire/plugin-admin'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://openfire-server:9090'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - openfire
      - cloudflare

networks:
  openfire:
    name: openfire
    external: false
  cloudflare:
    external: true
